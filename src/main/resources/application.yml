server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: recipe-management-system
  datasource:
    url: ${DB_URL:jdbc:h2:mem:recipes;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create-drop}
    defer-datasource-initialization: true
  sql:
    init:
      mode: ${SEED_DATA:always}
  h2:
    console:
      enabled: ${H2_CONSOLE:false}
  thymeleaf:
    cache: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Recipe Management System

# Demo users (override with environment variables in any shared environment)
app:
  security:
    users:
      - username: ${APP_AUTHOR_USER:author}
        password: ${APP_AUTHOR_PASSWORD:author123}
        roles: [AUTHOR]
      - username: ${APP_REVIEWER_USER:reviewer}
        password: ${APP_REVIEWER_PASSWORD:reviewer123}
        roles: [REVIEWER]
      - username: ${APP_ADMIN_USER:admin}
        password: ${APP_ADMIN_PASSWORD:admin123}
        roles: [ADMIN, AUTHOR, REVIEWER]
