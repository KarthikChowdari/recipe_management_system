---
# Points the systemd unit at `release_image`, restarts only if something changed, then health-checks.
# Inputs: release_version, release_image
- name: Make sure the release image is present - {{ release_image }}
  ansible.builtin.command: docker image inspect {{ release_image }}
  register: image_present
  changed_when: false
  failed_when: false

- name: Pull image - {{ release_image }}
  ansible.builtin.command: docker pull {{ release_image }}
  when: image_present.rc != 0
  changed_when: true

- name: Select release - {{ release_version }}
  ansible.builtin.template:
    src: release.env.j2
    dest: "{{ app_config_dir }}/release.env"
    owner: root
    group: root
    mode: "0644"
  register: release_env

- name: Restart the service with the selected release - {{ release_version }}
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    state: restarted
    enabled: true
    daemon_reload: true
  when: release_env.changed or (app_config_changed | default(false) | bool)

- name: Ensure the service is enabled and running
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    state: started
    enabled: true

- name: Health-check release - {{ release_version }}
  ansible.builtin.import_tasks: health_check.yml
