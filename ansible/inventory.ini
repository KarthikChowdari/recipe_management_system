# Target nodes for the Recipe Management System.
# Replace the example addresses with your servers (Ubuntu 22.04/24.04, Debian 12 or RHEL/Rocky 9).

[staging]
staging-app-01 ansible_host=192.168.56.11

[production]
prod-app-01 ansible_host=10.0.1.21
prod-app-02 ansible_host=10.0.1.22

# Deploy onto the machine running Ansible itself (e.g. the Jenkins agent):
#   ansible-playbook -i inventory.ini playbook.yml --limit local
[local]
localhost ansible_connection=local

[recipe_app_servers:children]
staging
production

[recipe_app_servers:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3

[staging:vars]
app_environment=staging
app_port=8080

[production:vars]
app_environment=production
app_port=80
